name: Bug report
description: An operation, tool or skill did something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. The more exact it is, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The operation or tool, the arguments you (or the agent) sent, and the reply or error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Smallest steps in a scratch project. A comp export or scene description helps a lot.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `fu_version_info` (Resolve build, Studio, connector version, Python).
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and model
      placeholder: e.g. Claude Code with Claude Opus
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
